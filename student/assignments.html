<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StudNest student portal for classes, assignments and academic progress.">
  <meta name="theme-color" content="#F7F6F2">
  <title>StudNest | Assignments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css?v=10" rel="stylesheet">
  <link href="../assets/css/theme-academic.css?v=10" rel="stylesheet">
</head>
<body data-page="assignments">
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar">
      <button id="menuToggle" class="icon-button menu-toggle" aria-label="Open navigation"><i class="bi bi-list"></i></button>
      <div class="breadcrumb-text"><span>Menu</span><i class="bi bi-chevron-right"></i><strong id="pageCrumb">Assignments</strong></div>
      <div class="topbar-right"><span class="top-date" id="todayLabel"></span><div class="top-avatar" id="topAvatar">SN</div></div>
    </header>
    <main class="page-content">

<section>
  <div class="welcome-row">
    <div>
      <h1>Assignments</h1>
      <p class="muted">Track deadlines and mark work as completed.</p>
    </div>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#assignmentModal"><i class="bi bi-plus-lg me-2"></i>Add assignment</button>
  </div>
  <div class="assignment-summary" id="assignmentSummary"></div>
  <section class="panel data-panel">
    <div class="toolbar">
      <div class="filter-tabs" role="group" aria-label="Filter assignments">
        <button type="button" class="filter-tab active" data-filter="all">All</button>
        <button type="button" class="filter-tab" data-filter="open">In progress</button>
        <button type="button" class="filter-tab" data-filter="done">Completed</button>
      </div>
      <div class="search-box"><i class="bi bi-search"></i>
        <input id="assignmentSearch" type="search" placeholder="Search assignments" aria-label="Search assignments">
      </div>
    </div>
    <div class="table-responsive">
      <table class="table align-middle hub-table assignments-table">
        <thead><tr><th>Assignment</th><th>Course</th><th>Priority</th><th>Due date</th><th>Status</th><th></th></tr></thead>
        <tbody id="assignmentsTable"></tbody>
      </table>
    </div>
    <div class="empty-state d-none" id="assignmentEmpty"><i class="bi bi-inbox"></i><strong>No assignments found</strong><span>Try another search or add a new assignment.</span></div>
  </section>
  <footer class="page-footer"><span>&copy; 2026 StudNest &middot; IMS566 Individual Project</span></footer>
</section>

    </main>
  </div>
</div>

<div class="modal fade" id="assignmentModal" tabindex="-1" aria-labelledby="assignmentModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="assignmentModalLabel">Add an assignment</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="assignmentForm">
        <div class="modal-body">
          <label for="newTitle" class="form-label">Assignment title</label>
          <input id="newTitle" class="form-control mb-3" required maxlength="70" placeholder="Assignment title">
          <label for="newCourse" class="form-label">Course</label>
          <select id="newCourse" class="form-select mb-3" required><option value="">Choose a subject</option></select>
          <div class="row">
            <div class="col-7">
              <label for="newDue" class="form-label">Due date</label>
              <input id="newDue" type="date" class="form-control" required>
            </div>
            <div class="col-5">
              <label for="newPriority" class="form-label">Priority</label>
              <select id="newPriority" class="form-select"><option>Medium</option><option>High</option><option>Low</option></select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save assignment</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="../assets/js/theme.js?v=1"></script>
<script src="../assets/js/seed.js?v=10"></script>
<script src="../assets/js/storage.js?v=10"></script>
<script src="../assets/js/auth.js?v=10"></script>
<script src="../assets/js/layout.js?v=10"></script>
<script src="../assets/js/app.js?v=10"></script>
</body>
</html>
