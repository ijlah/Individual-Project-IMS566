<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StudNest student portal for classes, assignments and academic progress.">
  <meta name="theme-color" content="#F7F6F2">
  <title>StudNest | Subjects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/styles.css?v=10" rel="stylesheet">
  <link href="../assets/css/theme-academic.css?v=10" rel="stylesheet">
</head>
<body data-page="subjects">
<div class="app-shell" id="appShell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar">
      <button id="menuToggle" class="icon-button menu-toggle" aria-label="Open navigation"><i class="bi bi-list"></i></button>
      <div class="breadcrumb-text"><span>Menu</span><i class="bi bi-chevron-right"></i><strong id="pageCrumb">Subjects</strong></div>
      <div class="topbar-right"><span class="top-date" id="todayLabel"></span><div class="top-avatar" id="topAvatar">SN</div></div>
    </header>
    <main class="page-content">

<section>
  <div class="welcome-row">
    <div><h1>Manage subjects</h1><p class="muted">Add or update subjects shown across the portal.</p></div>
    <button class="btn btn-primary" data-open-modal="subjectModal"><i class="bi bi-plus-lg me-2"></i>Add subject</button>
  </div>
  <section class="panel data-panel">
    <div class="panel-heading"><div><h2>Subject catalogue</h2><p id="subjectCountLabel">0 subjects</p></div></div>
    <div class="table-responsive">
      <table class="table align-middle hub-table">
        <thead><tr><th>Subject code</th><th>Subject title</th><th>Programme and semester</th><th>Assignments</th><th></th></tr></thead>
        <tbody id="subjectsTable"></tbody>
      </table>
    </div>
    <div class="empty-state d-none" id="subjectEmpty"><i class="bi bi-journal-x"></i><strong>No subjects yet</strong><span>Add a subject to build the catalogue.</span></div>
  </section>
  <footer class="page-footer"><span>&copy; 2026 StudNest &middot; IMS566 Individual Project</span></footer>
</section>

    </main>
  </div>
</div>

<div class="modal fade" id="subjectModal" tabindex="-1" aria-labelledby="subjectModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title" id="subjectModalLabel">Add a subject</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <form id="subjectForm"><div class="modal-body">
      <input id="subjectOriginalCode" type="hidden">
      <label for="subjectCode" class="form-label">Subject code</label>
      <input id="subjectCode" class="form-control mb-3" required maxlength="12" placeholder="e.g. IMS566">
      <label for="subjectName" class="form-label">Subject title</label>
      <input id="subjectName" class="form-control" required maxlength="100" placeholder="e.g. Advanced Web Design">
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save subject</button></div>
    </form>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="../assets/js/theme.js?v=1"></script>
<script src="../assets/js/seed.js?v=10"></script>
<script src="../assets/js/storage.js?v=10"></script>
<script src="../assets/js/auth.js?v=10"></script>
<script src="../assets/js/layout.js?v=10"></script>
<script src="../assets/js/app.js?v=10"></script>
</body>
</html>
